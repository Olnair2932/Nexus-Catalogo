<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS CATÁLOGO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: #ffffff;
        }

        header {
            padding: 24px 18px;
            text-align: center;
            border-bottom: 1px solid #202833;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            color: #9ca8b5;
        }

        .acoes {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .novo {
            background: #19e68c;
            color: #06130d;
        }

        .google-login {
            background: #ffffff;
            color: #202124;
            border: 1px solid #d9d9d9;
        }

        .google-login:hover {
            background: #f5f5f5;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .voltar {
            background: #202b38;
            color: white;
        }

        main {
            width: min(1100px, 94%);
            margin: auto;
            padding: 10px 0 40px;
        }

        #lista {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
        }

        .vazio {
            text-align: center;
            color: #9ca8b5;
            padding: 50px 20px;
            border: 1px dashed #303b48;
            border-radius: 14px;
        }

        .card {
            background: #121922;
            border: 1px solid #25303c;
            border-radius: 14px;
            padding: 18px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .preco {
            font-size: 22px;
            font-weight: bold;
            margin: 12px 0;
        }

        .abrir {
            width: 100%;
            background: #202b38;
            color: white;
        }

        #formulario {
            display: none;
            max-width: 700px;
            margin: 0 auto 40px;
            background: #121922;
            border: 1px solid #25303c;
            border-radius: 16px;
            padding: 22px;
        }

        #formulario h2 {
            margin-top: 0;
        }

        .campo {
            margin-bottom: 16px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .campo input,
        .campo textarea,
        .campo select {
            width: 100%;
            padding: 13px;
            border: 1px solid #303b48;
            border-radius: 9px;
            background: #0b0f14;
            color: white;
            font-size: 15px;
        }

        .campo textarea {
            min-height: 110px;
            resize: vertical;
        }

        .observacao {
            color: #9ca8b5;
            font-size: 13px;
            margin-top: 5px;
        }

        .salvar {
            width: 100%;
            background: #19e68c;
            color: #06130d;
        }

        .cancelar {
            width: 100%;
            margin-top: 10px;
            background: #202b38;
            color: white;
        }

        
        .vitrine-card {
            padding: 0;
            overflow: hidden;
        }

        .vitrine-imagem {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #0b0f14;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .vitrine-imagem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sem-imagem {
            font-size: 56px;
            color: #667382;
        }

        .vitrine-conteudo {
            padding: 16px;
        }

        .vitrine-codigo {
            font-size: 12px;
            color: #7f8b98;
            margin-bottom: 6px;
        }

        .vitrine-card h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .vitrine-condicao {
            display: inline-block;
            margin-bottom: 14px;
            padding: 5px 9px;
            border-radius: 7px;
            background: #202b38;
            color: #cbd5df;
            font-size: 13px;
        }

        .vitrine-card .abrir {
            margin-top: 6px;
        }

        .voltar-topo {
            display: block;
            width: 100%;
            max-width: 420px;
            margin: 30px auto 10px;
            background: #202b38;
            color: white;
        }


        /* ===== VISUAL PREMIUM — SOMENTE CSS ===== */

        :root {
            --fundo: #080c12;
            --fundo-secundario: #0d131b;
            --card: rgba(18, 25, 34, 0.94);
            --card-hover: #151e29;
            --borda: #263342;
            --texto: #f4f7fa;
            --texto-suave: #98a6b5;
            --verde: #19e68c;
            --verde-hover: #24f09a;
            --sombra: 0 18px 45px rgba(0, 0, 0, 0.28);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(circle at top center, rgba(25, 230, 140, 0.07), transparent 32%),
                linear-gradient(180deg, var(--fundo) 0%, #0b1017 100%);
            color: var(--texto);
            min-height: 100vh;
        }

        header {
            padding: 38px 18px 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            background: linear-gradient(
                180deg,
                rgba(17, 24, 33, 0.92),
                rgba(8, 12, 18, 0.72)
            );
        }

        header h1 {
            font-size: clamp(25px, 6vw, 34px);
            letter-spacing: 0.5px;
            text-shadow: 0 4px 20px rgba(25, 230, 140, 0.12);
        }

        header p {
            color: var(--texto-suave);
            font-size: 14px;
        }

        .acoes {
            padding: 24px 18px 20px;
        }

        button {
            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                background 0.18s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .novo,
        .salvar {
            background: linear-gradient(135deg, #19e68c, #12c979);
            box-shadow: 0 10px 25px rgba(25, 230, 140, 0.16);
        }

        .novo:hover,
        .salvar:hover {
            background: linear-gradient(135deg, #24f09a, #19e68c);
            box-shadow: 0 14px 30px rgba(25, 230, 140, 0.23);
        }

        main {
            padding-top: 8px;
        }

        #lista {
            gap: 22px;
        }

        .card,
        #formulario {
            background: linear-gradient(
                145deg,
                rgba(20, 29, 39, 0.98),
                rgba(13, 19, 27, 0.98)
            );
            border: 1px solid var(--borda);
            box-shadow: var(--sombra);
        }

        .vitrine-card {
            border-radius: 18px;
            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .vitrine-card:hover {
            transform: translateY(-5px);
            border-color: rgba(25, 230, 140, 0.38);
            box-shadow:
                0 22px 50px rgba(0, 0, 0, 0.34),
                0 0 0 1px rgba(25, 230, 140, 0.05);
        }

        .vitrine-imagem {
            background:
                radial-gradient(circle, rgba(25, 230, 140, 0.08), transparent 55%),
                #090e14;
        }

        .vitrine-imagem img {
            transition: transform 0.35s ease;
        }

        .vitrine-card:hover .vitrine-imagem img {
            transform: scale(1.025);
        }

        .vitrine-conteudo {
            padding: 18px;
        }

        .vitrine-codigo {
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: #788898;
        }

        .vitrine-card h2 {
            font-size: 21px;
            line-height: 1.25;
        }

        .vitrine-card .preco {
            font-size: 25px;
            color: var(--verde);
            letter-spacing: -0.3px;
        }

        .vitrine-condicao {
            background: rgba(32, 43, 56, 0.9);
            border: 1px solid #303e4d;
        }

        .vitrine-card .abrir,
        .voltar,
        .cancelar,
        .voltar-topo {
            background: linear-gradient(135deg, #1b2633, #151e29);
            border: 1px solid #304050;
        }

        .vitrine-card .abrir:hover,
        .voltar:hover,
        .cancelar:hover,
        .voltar-topo:hover {
            background: linear-gradient(135deg, #263544, #1c2835);
            border-color: #405366;
        }

        #formulario {
            border-radius: 20px;
            padding: 24px;
        }

        #formulario h2 {
            font-size: 24px;
            margin-bottom: 24px;
        }

        .campo label {
            color: #dce4eb;
        }

        .campo input,
        .campo textarea,
        .campo select {
            background: #090e14;
            border: 1px solid #2b3948;
            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease,
                background 0.18s ease;
        }

        .campo input:focus,
        .campo textarea:focus,
        .campo select:focus {
            outline: none;
            border-color: rgba(25, 230, 140, 0.65);
            box-shadow: 0 0 0 3px rgba(25, 230, 140, 0.09);
            background: #0b1118;
        }

        .observacao {
            color: #7f8d9c;
        }

        .vazio {
            background: rgba(13, 19, 27, 0.55);
            border-color: #344353;
        }

        .voltar-topo {
            margin-top: 34px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
        }

        .sem-imagem {
            opacity: 0.65;
        }

        @media (max-width: 600px) {
            header {
                padding-top: 30px;
            }

            .acoes {
                padding: 18px 14px;
            }

            .acoes button {
                width: 100%;
            }

            main {
                width: min(100% - 24px, 1100px);
            }

            #lista {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            #formulario {
                padding: 20px 16px;
                border-radius: 17px;
            }

            .vitrine-card h2 {
                font-size: 20px;
            }
        }

        /* Modo claro automático, sem JavaScript */
        @media (prefers-color-scheme: light) {
            :root {
                --fundo: #f3f6f8;
                --fundo-secundario: #ffffff;
                --card: #ffffff;
                --card-hover: #ffffff;
                --borda: #dce3e8;
                --texto: #17212b;
                --texto-suave: #657382;
                --sombra: 0 14px 35px rgba(30, 45, 60, 0.10);
            }

            body {
                background:
                    radial-gradient(circle at top center, rgba(25, 230, 140, 0.10), transparent 35%),
                    linear-gradient(180deg, #f8fafb 0%, #eef2f5 100%);
                color: var(--texto);
            }

            header {
                background: rgba(255, 255, 255, 0.88);
                border-bottom-color: #dce3e8;
            }

            header p {
                color: var(--texto-suave);
            }

            .card,
            #formulario {
                background: rgba(255, 255, 255, 0.96);
                border-color: #dce3e8;
                box-shadow: var(--sombra);
            }

            .vitrine-card:hover {
                border-color: rgba(25, 180, 110, 0.42);
                box-shadow: 0 20px 42px rgba(30, 45, 60, 0.14);
            }

            .vitrine-imagem {
                background:
                    radial-gradient(circle, rgba(25, 180, 110, 0.08), transparent 55%),
                    #edf2f5;
            }

            .vitrine-codigo {
                color: #748291;
            }

            .vitrine-condicao {
                background: #eef2f5;
                border-color: #d8e0e6;
                color: #52616f;
            }

            .vitrine-card .abrir,
            .voltar,
            .cancelar,
            .voltar-topo {
                background: linear-gradient(135deg, #ffffff, #edf2f5);
                border-color: #d2dce3;
                color: #24313d;
            }

            .vitrine-card .abrir:hover,
            .voltar:hover,
            .cancelar:hover,
            .voltar-topo:hover {
                background: #e7edf1;
                border-color: #c3d0d9;
            }

            .campo input,
            .campo textarea,
            .campo select {
                background: #f8fafb;
                border-color: #d2dce3;
                color: #17212b;
            }

            .campo input:focus,
            .campo textarea:focus,
            .campo select:focus {
                background: #ffffff;
            }

            .campo label {
                color: #33424f;
            }

            .vazio {
                background: rgba(255, 255, 255, 0.65);
                border-color: #ccd7df;
            }
        }

    </style>
</head>

<body>

<header>
    <h1>🛍️ NEXUS CATÁLOGO</h1>
    <p>Catálogo online de anúncios</p>
</header>

<div class="acoes">
    <button class="novo" onclick="mostrarFormulario()">
        ➕ NOVO ANÚNCIO
    </button>

    <button class="google-login" id="botaoGoogle" onclick="entrarComGoogle()">
        🔵 ENTRAR COM GOOGLE
    </button>

    <button class="google-login" id="botaoSair" onclick="sairDoGoogle()" style="display:none;">
        🚪 SAIR
    </button>
</div>

<main>

    <section id="formulario">

        <h2>➕ Novo anúncio</h2>

        <div class="campo">
            <label for="nome">Nome do produto</label>
            <input id="nome" type="text" placeholder="Ex.: Smartphone Galaxy A54">
        </div>

        <div class="campo">
            <label for="codigo">Código</label>
            <input id="codigo" type="text" placeholder="Ex.: PROD-0001">
        </div>

        <div class="campo">
            <label for="fotos">Fotos</label>
            <input id="fotos" type="file" accept="image/*">
            <div class="observacao">
                Selecione uma imagem da galeria do celular.
            </div>
        </div>

        <div class="campo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" placeholder="Descreva o produto..."></textarea>
        </div>

        <div class="campo">
            <label for="preco">Preço</label>
            <input id="preco" type="text" placeholder="Ex.: R$ 1.499,00">
        </div>

        <div class="campo">
            <label for="condicao">Condição</label>
            <select id="condicao">
                <option value="Novo">Novo</option>
                <option value="Usado">Usado</option>
            </select>
        </div>

        <div class="campo">
            <label for="vendedor">Nome do vendedor</label>
            <input id="vendedor" type="text" placeholder="Nome do vendedor">
        </div>

        <div class="campo">
            <label for="contato">Contato</label>
            <input id="contato" type="text" placeholder="WhatsApp ou telefone">
        </div>

        <div class="campo">
            <label for="endereco">Endereço para retirada</label>
            <input id="endereco" type="text" placeholder="Endereço de retirada">
        </div>

        <div class="campo">
            <label for="taxa">Taxa de entrega</label>
            <input id="taxa" type="text" placeholder="Ex.: R$ 10,00 ou Grátis">
        </div>

        <div class="campo">
            <label for="pagamento">Forma de pagamento</label>
            <input id="pagamento" type="text" placeholder="Ex.: Pix, dinheiro, cartão">
        </div>

        <div class="campo">
            <label for="video">Vídeo Cloudinary</label>
            <input id="video" type="url" placeholder="URL do vídeo no Cloudinary">

            <label for="videoArquivo">Ou envie um vídeo do celular</label>
            <input id="videoArquivo" type="file" accept="video/*">

            <div class="observacao">
                Você pode colar uma URL do Cloudinary ou enviar um vídeo da galeria.
            </div>
        </div>

        <button class="salvar" onclick="salvarAnuncio()">
            💾 CONTINUAR
        </button>

        <button class="cancelar" onclick="fecharFormulario()">
            CANCELAR
        </button>

    </section>

    <section id="catalogo">
        <div id="lista"></div>

        <button
            class="voltar-topo"
            onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
            ⬆️ VOLTAR AO TOPO
        </button>
    </section>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
    getAuth,
    signInAnonymously,
    signOut,
    onAuthStateChanged,
    GoogleAuthProvider,
    linkWithPopup
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAS2NIZzWujvEFCvznq7RRrpai3lfAr1YU",
    authDomain: "ia-termux.firebaseapp.com",
    databaseURL: "https://ia-termux-default-rtdb.firebaseio.com",
    projectId: "ia-termux",
    storageBucket: "ia-termux.firebasestorage.app",
    messagingSenderId: "563930488672",
    appId: "1:563930488672:web:dc73144be15c2a3a850805"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function aguardarEstadoAutenticacao() {
    return new Promise((resolve) => {
        const cancelar = onAuthStateChanged(auth, (usuario) => {
            cancelar();
            resolve(usuario);
        });
    });
}


let autenticacaoPronta = (async () => {
    await aguardarEstadoAutenticacao();

    await verificarRetornoGoogle();

    if (!auth.currentUser) {
        await signInAnonymously(auth);
        await aguardarEstadoAutenticacao();
    }

    atualizarIndicadorUsuario(auth.currentUser);
})();

function atualizarIndicadorUsuario(usuario) {
    const botao = document.getElementById("botaoGoogle");
    const botaoSair = document.getElementById("botaoSair");

    if (!botao || !botaoSair || !usuario) {
        return;
    }

    if (usuario.isAnonymous) {
        botao.style.display = "";
        botao.innerHTML = "🔵 ENTRAR COM GOOGLE";
        botaoSair.style.display = "none";
        return;
    }

    const email = usuario.email || "Conta Google";

    botao.style.display = "";

    if (usuario.photoURL) {
        botao.innerHTML = `
            <img
                src="${usuario.photoURL}"
                alt="Foto do usuário"
                style="
                    width: 28px;
                    height: 28px;
                    border-radius: 50%;
                    vertical-align: middle;
                    margin-right: 8px;
                "
            >
            ${email}
        `;
    } else {
        botao.innerHTML = `CONECTADO: ${email}`;
    }

    botaoSair.style.display = "";
}

async function verificarRetornoGoogle() {
    if (auth.currentUser) {
        atualizarIndicadorUsuario(auth.currentUser);
    }
}

async function entrarComGoogle() {
    try {
        const usuario = auth.currentUser;

        if (!usuario) {
            throw new Error("Autenticação ainda não está pronta.");
        }

        if (!usuario.isAnonymous) {
            alert("Você já está conectado com uma conta Google.");
            return;
        }

        const provider = new GoogleAuthProvider();

        await linkWithPopup(usuario, provider);

    } catch (erro) {
        console.error("Erro ao vincular Google:", erro);

        if (erro.code === "auth/credential-already-in-use") {
            alert(
                "Esta conta Google já está vinculada a outro usuário."
            );
            return;
        }

        alert(
            "Não foi possível entrar com Google.\n\n" +
            erro.message
        );
    }
}



async function carregarAnuncios() {

    const lista = document.getElementById("lista");

    try {

        const resposta = await fetch("/api/anuncios");
        const anuncios = await resposta.json();

        if (!anuncios.length) {

            lista.innerHTML = `
                <div class="vazio">
                    <h2>Nenhum anúncio cadastrado</h2>
                    <p>Use "Novo anúncio" para criar o primeiro produto.</p>
                </div>
            `;

            return;
        }

        lista.innerHTML = anuncios.map(anuncio => `

            <article class="card vitrine-card">

                <div class="vitrine-imagem">
                    ${
                        anuncio.fotos
                            ? `<img src="${anuncio.fotos}" alt="${anuncio.nome || "Produto"}">`
                            : `<div class="sem-imagem">📦</div>`
                    }
                </div>

                <div class="vitrine-conteudo">

                    <div class="vitrine-codigo">
                        ${anuncio.codigo || ""}
                    </div>

                    <h2>${anuncio.nome || "Produto"}</h2>

                    <div class="preco">
                        ${anuncio.preco || ""}
                    </div>

                    <div class="vitrine-condicao">
                        ${anuncio.condicao || ""}
                    </div>

                    <button
                        class="abrir"
                        onclick="abrirAnuncio('${anuncio.id}')">
                        👁️ VER ANÚNCIO
                    </button>

                    <button
                        class="abrir"
                        onclick="excluirAnuncio('${anuncio.id}')">
                        🗑️ EXCLUIR
                    </button>

                </div>

            </article>

        `).join("");

    } catch (erro) {

        lista.innerHTML = `
            <div class="vazio">
                <h2>Erro ao carregar catálogo</h2>
                <p>${erro.message}</p>
            </div>
        `;
    }
}


function mostrarFormulario() {

    document.getElementById("formulario").style.display = "block";

    document.getElementById("catalogo").style.display = "none";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function fecharFormulario() {

    document.getElementById("formulario").style.display = "none";

    document.getElementById("catalogo").style.display = "block";
}


function abrirAnuncio(id) {

    window.location.href = "/anuncios/" + id + "/";
}


async function excluirAnuncio(id) {

    const confirmar = confirm(
        "Tem certeza que deseja excluir este anúncio?"
    );

    if (!confirmar) {
        return;
    }

    try {

        const usuario = auth.currentUser;

        if (!usuario) {
            throw new Error("Autenticação ainda não está pronta.");
        }

        const token = await usuario.getIdToken();

        const resposta = await fetch(
            "/api/anuncios/" + id,
            {
                method: "DELETE",
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const resultado = await resposta.json();

        if (!resposta.ok || !resultado.ok) {
            throw new Error(
                resultado.message ||
                resultado.error ||
                "Não foi possível excluir o anúncio."
            );
        }

        alert("✅ Anúncio excluído com sucesso.");

        carregarAnuncios();

    } catch (erro) {

        console.error(erro);

        alert(
            "❌ Não foi possível excluir o anúncio.\n\n" +
            erro.message
        );
    }
}


async function salvarAnuncio() {

    const arquivoFoto = document.getElementById("fotos").files[0];

    if (!arquivoFoto) {
        alert("Selecione uma foto do produto.");
        return;
    }

    try {

        const formulario = new FormData();
        formulario.append("imagem", arquivoFoto);

        const upload = await fetch("/api/upload-imagem", {
            method: "POST",
            body: formulario
        });

        const resultadoUpload = await upload.json();

        if (!upload.ok || !resultadoUpload.ok) {
            throw new Error(
                resultadoUpload.message ||
                resultadoUpload.error ||
                "Não foi possível enviar a imagem."
            );
        }

        let urlVideo = document.getElementById("video").value.trim();

        const arquivoVideo = document.getElementById("videoArquivo").files[0];

        if (arquivoVideo) {

            const formularioVideo = new FormData();
            formularioVideo.append("video", arquivoVideo);

            const uploadVideo = await fetch("/api/upload-video", {
                method: "POST",
                body: formularioVideo
            });

            const resultadoVideo = await uploadVideo.json();

            if (!uploadVideo.ok || !resultadoVideo.ok) {
                throw new Error(
                    resultadoVideo.message ||
                    resultadoVideo.error ||
                    "Não foi possível enviar o vídeo."
                );
            }

            urlVideo = resultadoVideo.url;
        }

        const dados = {
            nome: document.getElementById("nome").value.trim(),
            codigo: document.getElementById("codigo").value.trim(),
            fotos: resultadoUpload.url,
            descricao: document.getElementById("descricao").value.trim(),
            preco: document.getElementById("preco").value.trim(),
            condicao: document.getElementById("condicao").value,
            vendedor: document.getElementById("vendedor").value.trim(),
            contato: document.getElementById("contato").value.trim(),
            endereco: document.getElementById("endereco").value.trim(),
            taxa: document.getElementById("taxa").value.trim(),
            pagamento: document.getElementById("pagamento").value.trim(),
            video: urlVideo
        };

        if (!dados.nome) {
            alert("Informe o nome do produto.");
            return;
        }

        const usuario = auth.currentUser;

        if (!usuario) {
            throw new Error("Autenticação ainda não está pronta.");
        }

        const token = await usuario.getIdToken();

        const resposta = await fetch("/api/anuncios", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();

        if (!resposta.ok || !resultado.ok) {
            throw new Error(
                resultado.message ||
                resultado.error ||
                "Não foi possível criar o anúncio."
            );
        }

        alert("✅ Anúncio criado com sucesso!");

        window.location.href = resultado.url;

    } catch (erro) {

        console.error(erro);

        alert(
            "❌ Não foi possível criar o anúncio.\n\n" +
            erro.message
        );
    }
}window.mostrarFormulario = mostrarFormulario;
window.fecharFormulario = fecharFormulario;
window.abrirAnuncio = abrirAnuncio;
window.excluirAnuncio = excluirAnuncio;
window.salvarAnuncio = salvarAnuncio;

}
