<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS CATÁLOGO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: #ffffff;
        }

        header {
            padding: 24px 18px;
            text-align: center;
            border-bottom: 1px solid #202833;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            color: #9ca8b5;
        }

        .acoes {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .novo {
            background: #19e68c;
            color: #06130d;
        }

        .voltar {
            background: #202b38;
            color: white;
        }

        main {
            width: min(1100px, 94%);
            margin: auto;
            padding: 10px 0 40px;
        }

        #lista {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
        }

        .vazio {
            text-align: center;
            color: #9ca8b5;
            padding: 50px 20px;
            border: 1px dashed #303b48;
            border-radius: 14px;
        }

        .card {
            background: #121922;
            border: 1px solid #25303c;
            border-radius: 14px;
            padding: 18px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .preco {
            font-size: 22px;
            font-weight: bold;
            margin: 12px 0;
        }

        .abrir {
            width: 100%;
            background: #202b38;
            color: white;
        }

        #formulario {
            display: none;
            max-width: 700px;
            margin: 0 auto 40px;
            background: #121922;
            border: 1px solid #25303c;
            border-radius: 16px;
            padding: 22px;
        }

        #formulario h2 {
            margin-top: 0;
        }

        .campo {
            margin-bottom: 16px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .campo input,
        .campo textarea,
        .campo select {
            width: 100%;
            padding: 13px;
            border: 1px solid #303b48;
            border-radius: 9px;
            background: #0b0f14;
            color: white;
            font-size: 15px;
        }

        .campo textarea {
            min-height: 110px;
            resize: vertical;
        }

        .observacao {
            color: #9ca8b5;
            font-size: 13px;
            margin-top: 5px;
        }

        .salvar {
            width: 100%;
            background: #19e68c;
            color: #06130d;
        }

        .cancelar {
            width: 100%;
            margin-top: 10px;
            background: #202b38;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>🛍️ NEXUS CATÁLOGO</h1>
    <p>Catálogo online de anúncios</p>
</header>

<div class="acoes">
    <button class="novo" onclick="mostrarFormulario()">
        ➕ NOVO ANÚNCIO
    </button>
</div>

<main>

    <section id="formulario">

        <h2>➕ Novo anúncio</h2>

        <div class="campo">
            <label for="nome">Nome do produto</label>
            <input id="nome" type="text" placeholder="Ex.: Smartphone Galaxy A54">
        </div>

        <div class="campo">
            <label for="codigo">Código</label>
            <input id="codigo" type="text" placeholder="Ex.: PROD-0001">
        </div>

        <div class="campo">
            <label for="fotos">Fotos</label>
            <input id="fotos" type="file" accept="image/*">
            <div class="observacao">
                Selecione uma imagem da galeria do celular.
            </div>
        </div>

        <div class="campo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" placeholder="Descreva o produto..."></textarea>
        </div>

        <div class="campo">
            <label for="preco">Preço</label>
            <input id="preco" type="text" placeholder="Ex.: R$ 1.499,00">
        </div>

        <div class="campo">
            <label for="condicao">Condição</label>
            <select id="condicao">
                <option value="Novo">Novo</option>
                <option value="Usado">Usado</option>
            </select>
        </div>

        <div class="campo">
            <label for="vendedor">Nome do vendedor</label>
            <input id="vendedor" type="text" placeholder="Nome do vendedor">
        </div>

        <div class="campo">
            <label for="contato">Contato</label>
            <input id="contato" type="text" placeholder="WhatsApp ou telefone">
        </div>

        <div class="campo">
            <label for="endereco">Endereço para retirada</label>
            <input id="endereco" type="text" placeholder="Endereço de retirada">
        </div>

        <div class="campo">
            <label for="taxa">Taxa de entrega</label>
            <input id="taxa" type="text" placeholder="Ex.: R$ 10,00 ou Grátis">
        </div>

        <div class="campo">
            <label for="pagamento">Forma de pagamento</label>
            <input id="pagamento" type="text" placeholder="Ex.: Pix, dinheiro, cartão">
        </div>

        <div class="campo">
            <label for="video">Vídeo Cloudinary</label>
            <input id="video" type="url" placeholder="URL do vídeo no Cloudinary">

            <label for="videoArquivo">Ou envie um vídeo do celular</label>
            <input id="videoArquivo" type="file" accept="video/*">

            <div class="observacao">
                Você pode colar uma URL do Cloudinary ou enviar um vídeo da galeria.
            </div>
        </div>

        <button class="salvar" onclick="salvarAnuncio()">
            💾 CONTINUAR
        </button>

        <button class="cancelar" onclick="fecharFormulario()">
            CANCELAR
        </button>

    </section>

    <section id="catalogo">
        <div id="lista"></div>
    </section>

</main>

<script>

async function carregarAnuncios() {

    const lista = document.getElementById("lista");

    try {

        const resposta = await fetch("/api/anuncios");
        const anuncios = await resposta.json();

        if (!anuncios.length) {

            lista.innerHTML = `
                <div class="vazio">
                    <h2>Nenhum anúncio cadastrado</h2>
                    <p>Use "Novo anúncio" para criar o primeiro produto.</p>
                </div>
            `;

            return;
        }

        lista.innerHTML = anuncios.map(anuncio => `
            <article class="card">

                <h2>${anuncio.nome || "Produto"}</h2>

                <div class="preco">
                    ${anuncio.preco || ""}
                </div>

                <button
                    class="abrir"
                    onclick="abrirAnuncio('${anuncio.id}')">
                    👁️ ABRIR ANÚNCIO
                </button>

                <button
                    class="abrir"
                    onclick="excluirAnuncio('${anuncio.id}')">
                    🗑️ EXCLUIR
                </button>

            </article>
        `).join("");

    } catch (erro) {

        lista.innerHTML = `
            <div class="vazio">
                <h2>Erro ao carregar catálogo</h2>
                <p>${erro.message}</p>
            </div>
        `;
    }
}


function mostrarFormulario() {

    document.getElementById("formulario").style.display = "block";

    document.getElementById("catalogo").style.display = "none";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function fecharFormulario() {

    document.getElementById("formulario").style.display = "none";

    document.getElementById("catalogo").style.display = "block";
}


function abrirAnuncio(id) {

    window.location.href = "/anuncios/" + id + "/";
}


async function excluirAnuncio(id) {

    const confirmar = confirm(
        "Tem certeza que deseja excluir este anúncio?"
    );

    if (!confirmar) {
        return;
    }

    try {

        const resposta = await fetch(
            "/api/anuncios/" + id,
            {
                method: "DELETE"
            }
        );

        const resultado = await resposta.json();

        if (!resposta.ok || !resultado.ok) {
            throw new Error(
                resultado.message ||
                resultado.error ||
                "Não foi possível excluir o anúncio."
            );
        }

        alert("✅ Anúncio excluído com sucesso.");

        carregarAnuncios();

    } catch (erro) {

        console.error(erro);

        alert(
            "❌ Não foi possível excluir o anúncio.\n\n" +
            erro.message
        );
    }
}


async function salvarAnuncio() {

    const arquivoFoto = document.getElementById("fotos").files[0];

    if (!arquivoFoto) {
        alert("Selecione uma foto do produto.");
        return;
    }

    try {

        const formulario = new FormData();
        formulario.append("imagem", arquivoFoto);

        const upload = await fetch("/api/upload-imagem", {
            method: "POST",
            body: formulario
        });

        const resultadoUpload = await upload.json();

        if (!upload.ok || !resultadoUpload.ok) {
            throw new Error(
                resultadoUpload.message ||
                resultadoUpload.error ||
                "Não foi possível enviar a imagem."
            );
        }

        let urlVideo = document.getElementById("video").value.trim();

        const arquivoVideo = document.getElementById("videoArquivo").files[0];

        if (arquivoVideo) {

            const formularioVideo = new FormData();
            formularioVideo.append("video", arquivoVideo);

            const uploadVideo = await fetch("/api/upload-video", {
                method: "POST",
                body: formularioVideo
            });

            const resultadoVideo = await uploadVideo.json();

            if (!uploadVideo.ok || !resultadoVideo.ok) {
                throw new Error(
                    resultadoVideo.message ||
                    resultadoVideo.error ||
                    "Não foi possível enviar o vídeo."
                );
            }

            urlVideo = resultadoVideo.url;
        }

        const dados = {
            nome: document.getElementById("nome").value.trim(),
            codigo: document.getElementById("codigo").value.trim(),
            fotos: resultadoUpload.url,
            descricao: document.getElementById("descricao").value.trim(),
            preco: document.getElementById("preco").value.trim(),
            condicao: document.getElementById("condicao").value,
            vendedor: document.getElementById("vendedor").value.trim(),
            contato: document.getElementById("contato").value.trim(),
            endereco: document.getElementById("endereco").value.trim(),
            taxa: document.getElementById("taxa").value.trim(),
            pagamento: document.getElementById("pagamento").value.trim(),
            video: urlVideo
        };

        if (!dados.nome) {
            alert("Informe o nome do produto.");
            return;
        }

        const resposta = await fetch("/api/anuncios", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();

        if (!resposta.ok || !resultado.ok) {
            throw new Error(
                resultado.message ||
                resultado.error ||
                "Não foi possível criar o anúncio."
            );
        }

        alert("✅ Anúncio criado com sucesso!");

        window.location.href = resultado.url;

    } catch (erro) {

        console.error(erro);

        alert(
            "❌ Não foi possível criar o anúncio.\n\n" +
            erro.message
        );
    }
}carregarAnuncios();

</script>

</body>
</html>
